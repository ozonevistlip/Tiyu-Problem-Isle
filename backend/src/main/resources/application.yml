server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cppkid_oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: "cppkid-oj-dev-secret-change-me-at-least-32-bytes"
  expire-minutes: 1440

oj:
  judge:
    queue-name: judge_queue
    work-dir: ./judge-work
    docker-image: gcc:13
    time-limit-ms: 2000
    memory-limit-mb: 128
